<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <title>AzuLamb</title>
    <style type="text/css">
      * {
        margin: 0;
        padding: 0;
      }
      html {
        height: 100%;
        font-size: 3vmin;
      }
      body {
        height: 100%;
        padding: 0;
        margin: 0;
        background: #2a233b;
        color: #a1afc9;
        display: grid;
        grid-template-rows: 2rem auto 1rem;
        gap: 1.2rem;
      }
      h1 {
        font-size: 1.5em;
        text-align: center;
        line-height: 2rem;
      }
      h2 {
        font-size: 1.2em;
        text-align: center;
        font-weight: normal;
      }
      body > article {
        display: flex;
        flex-direction: column;
        gap: 0.8rem;
        width: 30rem;
        margin: 0 auto;
      }
      footer {
        text-align: center;
        line-height: 0.6rem;
      }
      small {
        font-size: 0.6em;
      }
      a {
        color: #3670db;
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }
      .platforms, .links {
        display: flex;
        gap: 0.4rem;
        justify-content: center;
        list-style: none;
      }
      .software-list {
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 0.8rem;
      }
      .software-item {
        display: grid;
        grid-template-columns: 2rem auto;
        grid-template-rows: 2rem auto;
        grid-template-areas:
          "icon name"
          "icon description";
        gap: 0.4rem;
      }
      .software-item > img {
        grid-area: icon;
        width: 100%;
      }
      .software-item > h3 {
        grid-area: name;
        font-size: 1em;
        line-height: 2rem;
      }
      .software-item > div {
        grid-area: description;
      }
      .software-item .platforms, .software-item .links {
        justify-content: end;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>AzuLamb</h1>
    </header>
    <article>
      <h2>Link</h2>
      <ul class="links">
        <li><a href="https://github.com/azulamb">GitHub</a></li>
      </ul>
      <h2>Software</h2>
      <section>:SOFTWARE_LIST:</section>
    </article>
    <footer>
      <small>&copy; 2011 Hiroki</small>
    </footer>
  </body>
</html>
