<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <title>AzuLamb</title>
    <style>
      :root {
        --main-back: #2a233b;
        --main-front: #a1afc9;
        --link-color: #3670db;
      }
      * {
        margin: 0;
        padding: 0;
      }
      html {
        height: 100%;
        font-size: 3vmin;
      }
      body {
        height: 100%;
        background: var(--main-back);
        color: var(--main-front);
        display: grid;
        grid-template-rows: 4rem auto 1rem;
        gap: 1.2rem;
      }
      header {
        box-sizing: border-box;
        margin: 1rem 0 0;
        background: url(./icon.svg) center center / contain no-repeat;
      }
      h1, h2 {
        margin: 0;
        padding: 0;
      }
      h1 {
        font-size: 1.5em;
        text-align: center;
        line-height: 2rem;
      }
      h2 {
        font-size: 1.2em;
        text-align: center;
        font-weight: normal;
        margin-top: 0.8rem;
      }
      body > article {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        gap: 0.4rem;
        width: 98%;
        max-width: 30rem;
        margin: 0 auto;
      }
      body > article > * {
        max-width: 100%;
      }
      footer {
        text-align: center;
        line-height: 0.6rem;
      }
      small {
        font-size: 0.6em;
      }
      a {
        color: var(--link-color);
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }
      .platforms, .links {
        display: flex;
        gap: 0.4rem;
        justify-content: center;
        list-style: none;
      }
      .software-list {
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 0.8rem;
      }
      .software-list > li {
        background: rgba(255, 255, 255, 0.1);
        border-radius: 0.6rem;
        box-sizing: border-box;
        padding: 0.4rem;
      }
      .software-item {
        display: grid;
        grid-template-columns: 2rem auto;
        grid-template-rows: 2rem auto;
        grid-template-areas:
          "icon name"
          "icon description";
        gap: 0.4rem;
      }
      .software-item > img {
        grid-area: icon;
        width: 100%;
      }
      .software-item > h3 {
        grid-area: name;
        font-size: 1em;
        line-height: 2rem;
      }
      .software-item > div {
        grid-area: description;
      }
      .software-item .platforms, .software-item .links {
        justify-content: end;
      }
    </style>
  </head>
  <body>
    <header></header>
    <article>
      <h1>AzuLamb</h1>
      <p>主に個人向けのアプリを作っています。</p>
      <h2>Link</h2>
      <ul class="links">
        <li><a href="https://github.com/azulamb">GitHub</a></li>
      </ul>
      <h2>Software</h2>
      :SOFTWARE_LIST:
    </article>
    <footer>
      <small>&copy; 2011 Hiroki</small>
    </footer>
  </body>
</html>
